<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Claude Canlı</title>
<style>
  :root {
    --bg: #0c0c0b; --card: #151513; --card2: #1b1b18; --line: #2a2925; --text: #eceae3; --dim: #8e8b81;
    --accent: #f2c94c; --run: #e8856a; --ok: #74c69d; --warn: #f2994a; --err: #ef6b6b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg) radial-gradient(#1d1c19 1px, transparent 1px) 0 0 / 18px 18px;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  header h1 span { color: var(--accent); }
  .conn { font: 12px var(--mono); color: var(--dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); flex: none; }
  .conn.on .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .session { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .session.waiting { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn), 0 0 24px #f2994a33; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
  .session h2 { margin: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font: 600 12px var(--mono); padding: 4px 9px; border-radius: 99px; white-space: nowrap; background: var(--card2); color: var(--dim); border: 1px solid var(--line); }
  .pill.working { color: #17150c; background: var(--accent); border-color: var(--accent); }
  .pill.waiting { color: #1a0f05; background: var(--warn); border-color: var(--warn); }
  .pill.error { color: #fff; background: var(--err); border-color: var(--err); }
  .pill.working, .pill.waiting { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .65; } }
  .meta { color: var(--dim); font: 12px var(--mono); margin-top: 4px; overflow-wrap: anywhere; }
  .now { margin-top: 10px; display: flex; align-items: center; gap: 8px; font: 13px var(--mono); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .now .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now b { color: var(--accent); font-weight: 600; }
  .now .el { color: var(--dim); flex: none; }
  .spin { width: 12px; height: 12px; flex: none; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .prompt, .message { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: #f2c94c0d; border-radius: 0 8px 8px 0; font-size: 14px; overflow-wrap: anywhere; }
  .message { border-left-color: var(--ok); background: #74c69d0d; color: #d6d3ca; }
  .label { font: 11px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 8px; }
  .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .agent { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
  .agent.running { border-color: #e8856a66; }
  .agent.done { opacity: .72; }
  .agent .row b { font: 600 12px var(--mono); color: var(--run); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent.done .row b { color: var(--ok); }
  .agent .time { font: 11px var(--mono); color: var(--dim); flex: none; }
  .agent .desc { font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .blocks { display: flex; flex-wrap: wrap; gap: 2px; margin: 8px 0 6px; }
  .blocks i { width: 7px; height: 7px; border-radius: 1px; background: var(--line); }
  .blocks i.f { background: var(--run); }
  .agent.done .blocks i.f { background: var(--ok); }
  .blocks i.l { animation: pulse 1s infinite; }
  .agent .cur { font: 11.5px var(--mono); color: #cfccc2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent.done .cur { white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; color: var(--dim); }
  .agent .meta { margin-top: 4px; font-size: 11px; }
  .feed { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; }
  .ev { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid #22211d; font: 12px var(--mono); align-items: baseline; }
  .ev:last-child { border-bottom: 0; }
  .ev .t { color: var(--dim); }
  .ev .w { color: var(--accent); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .w.sub { color: var(--run); }
  .ev .x { overflow-wrap: anywhere; color: #d6d3ca; }
  .empty { color: var(--dim); text-align: center; padding: 36px 16px; border: 1px dashed var(--line); border-radius: 16px; }
  .login { max-width: 380px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .login p { color: var(--dim); font-size: 14px; margin: 6px 0 14px; }
  .login input { width: 100%; font: 16px var(--mono); padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .login button { margin-top: 10px; width: 100%; padding: 12px; font: 600 15px system-ui; border: 0; border-radius: 10px; background: var(--accent); color: #17150c; }
  .login .err { color: var(--err); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Claude <span>Canlı</span></h1>
    <div class="conn" id="conn"><span class="dot"></span><span id="connText">bağlanıyor…</span></div>
  </header>
  <main id="app"></main>
</div>
<script>
'use strict';
const KEY = 'claude-live-token';
const STATUS = { working: 'Çalışıyor', waiting: 'Seni bekliyor', idle: 'Boşta', error: 'Hata', ended: 'Kapandı' };
const app = document.getElementById('app');
let token = '', es = null, state = null, skew = 0;

try { token = localStorage.getItem(KEY) || ''; } catch {}
if (location.hash.length > 1) {
  token = decodeURIComponent(location.hash.slice(1));
  try { localStorage.setItem(KEY, token); } catch {}
  history.replaceState(null, '', location.pathname);
}

function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const pad = (n) => String(n).padStart(2, '0');
const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}` : `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const ago = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return s < 60 ? `${s} sn` : s < 3600 ? `${Math.floor(s / 60)} dk` : `${Math.floor(s / 3600)} sa`; };
const hhmm = (t) => { const d = new Date(t + skew); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };

function setConn(on, text) {
  document.getElementById('conn').classList.toggle('on', on);
  document.getElementById('connText').textContent = text;
}

function showLogin(msg) {
  if (es) es.close();
  state = null;
  setConn(false, 'token yok');
  const box = h('form', 'login');
  box.append(h('h2', null, 'Bağlan'));
  box.append(h('p', msg ? 'err' : null, msg || 'Sunucuyu başlattığın terminaldeki bağlantıyı aç ya da # işaretinden sonraki kodu buraya yaz.'));
  const input = h('input');
  Object.assign(input, { placeholder: 'token', autocapitalize: 'off', autocomplete: 'off', spellcheck: false, value: token });
  box.append(input, h('button', null, 'Bağlan'));
  box.onsubmit = (e) => {
    e.preventDefault();
    token = input.value.trim();
    try { localStorage.setItem(KEY, token); } catch {}
    connect();
  };
  app.replaceChildren(box);
}

function connect() {
  if (!token) return showLogin();
  if (es) es.close();
  setConn(false, 'bağlanıyor…');
  es = new EventSource('/stream?t=' + encodeURIComponent(token));
  es.onmessage = (m) => {
    state = JSON.parse(m.data);
    skew = Date.now() - state.now;
    setConn(true, 'canlı');
    render();
  };
  es.onerror = () => {
    setConn(false, 'bağlantı yok');
    if (es.readyState !== EventSource.CLOSED) return; // tarayıcı kendisi yeniden deneyecek
    fetch('/ok?t=' + encodeURIComponent(token))
      .then((r) => (r.status === 401 ? showLogin('Token yanlış.') : setTimeout(connect, 3000)))
      .catch(() => setTimeout(connect, 3000));
  };
}

// Telefon arka plana atınca bağlantı kopar; geri dönünce yeniden bağlan.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && token && (!es || es.readyState === EventSource.CLOSED)) connect();
});

function toolLine(t, now) {
  const el = h('div', 'now');
  const txt = h('span', 'txt');
  txt.append(h('b', null, t.name), document.createTextNode(t.detail ? ' · ' + t.detail : ''));
  el.append(h('span', 'spin'), txt, h('span', 'el', clock(now - t.at)));
  return el;
}

function agentCard(a, now) {
  const el = h('div', 'agent ' + a.status);
  const head = h('div', 'row');
  head.append(h('b', null, a.type), h('span', 'time', clock((a.endedAt || now) - a.startedAt)));
  el.append(head);
  if (a.desc) el.append(h('div', 'desc', a.desc));
  const blocks = h('div', 'blocks');
  const n = Math.min(a.tools, 24);
  for (let i = 0; i < 24; i++) blocks.append(h('i', i >= n ? null : i === n - 1 && a.status === 'running' ? 'f l' : 'f'));
  el.append(blocks);
  const t = a.running[a.running.length - 1];
  el.append(h('div', 'cur', a.status === 'done' ? a.result || 'Bitti' : t ? `${t.name} · ${t.detail}` : 'düşünüyor…'));
  el.append(h('div', 'meta', `${a.tools} araç${a.errors ? ` · ${a.errors} hata` : ''}${a.status === 'done' ? ' · bitti' : ''}`));
  return el;
}

function sessionCard(s, now) {
  const el = h('section', 'session ' + s.status);
  const top = h('div', 'row');
  top.append(h('h2', null, s.project), h('span', 'pill ' + s.status, STATUS[s.status] || s.status));
  el.append(top);
  const active = s.agents.filter((a) => a.status === 'running').length;
  el.append(h('div', 'meta', [
    s.model, `${s.tools} araç`,
    s.agents.length && `${s.agents.length} alt ajan${active ? ` (${active} aktif)` : ''}`,
    `son: ${ago(now - s.updatedAt)} önce`,
  ].filter(Boolean).join(' · ')));
  for (const t of s.running.slice(-2)) el.append(toolLine(t, now));
  if (s.running.length > 2) el.append(h('div', 'meta', `+${s.running.length - 2} araç daha çalışıyor`));
  if (s.prompt) el.append(h('p', 'prompt', s.prompt));
  if (s.message && s.status !== 'working') el.append(h('p', 'message', s.message));
  if (s.agents.length) {
    el.append(h('div', 'label', 'Alt ajanlar'));
    const grid = h('div', 'agents');
    const order = [...s.agents].sort((a, b) => (a.status === 'running') - (b.status === 'running') || a.startedAt - b.startedAt).reverse();
    for (const a of order) grid.append(agentCard(a, now));
    el.append(grid);
  }
  return el;
}

function render() {
  if (!state) return;
  const now = Date.now() - skew;
  const nodes = [];
  if (!state.sessions.length) {
    nodes.push(h('div', 'empty', 'Henüz olay yok. Claude Code’da bir şey başlat, burada belirecek.'));
  }
  for (const s of state.sessions) nodes.push(sessionCard(s, now));
  if (state.feed.length) {
    nodes.push(h('div', 'label', 'Akış'));
    const feed = h('div', 'feed');
    const many = state.sessions.length > 1;
    for (const e of state.feed.slice(-20).reverse()) {
      const row = h('div', 'ev');
      row.append(h('span', 't', hhmm(e.t)), h('span', 'w' + (e.who === 'ana' ? '' : ' sub'), many && e.who === 'ana' ? e.project : e.who), h('span', 'x', e.text));
      feed.append(row);
    }
    nodes.push(feed);
  }
  app.replaceChildren(...nodes);
  const st = state.sessions.map((s) => s.status);
  document.title = st.includes('waiting') ? '⏳ Seni bekliyor · Claude Canlı' : st.includes('working') ? '● Çalışıyor · Claude Canlı' : 'Claude Canlı';
}

setInterval(render, 1000);
connect();
</script>
</body>
</html>
